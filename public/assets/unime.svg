<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="unimeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="unimeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a5e" />
      <stop offset="100%" stop-color="#14468f" />
    </linearGradient>
  </defs>
  
  <!-- Sigillo Circolare Stile Universitario -->
  <g transform="translate(60, 60)">
    <circle r="48" fill="url(#unimeBlue)" stroke="url(#unimeGold)" stroke-width="3.5" />
    <circle r="40" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3,3" />
    
    <!-- Corona d'alloro stilizzata -->
    <path d="M -24 15 C -30 -10 -15 -30 0 -34 C 15 -30 30 -10 24 15 C 15 28 -15 28 -24 15 Z" fill="none" stroke="url(#unimeGold)" stroke-width="2" />
    
    <!-- Libro Aperto centrale -->
    <path d="M -18 8 Q -1 12 0 4 Q 1 12 18 8 L 18 -10 Q 1 -6 0 -14 Q -1 -6 -18 -10 Z" fill="url(#unimeGold)" />
    <!-- Pagine Libro -->
    <path d="M -16 6 Q -1 10 0 2 L 0 -12 Q -1 -4 -16 -8 Z" fill="#ffffff" />
    <path d="M 16 6 Q 1 10 0 2 L 0 -12 Q 1 -4 16 -8 Z" fill="#f0f0f0" />
    
    <!-- Stella sopra il libro -->
    <polygon points="0,-22 2.5,-16 8,-16 3.5,-12 5.5,-6 0,-10 -5.5,-6 -3.5,-12 -8,-16 -2.5,-16" fill="url(#unimeGold)" />
    
    <!-- Anno di fondazione -->
    <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="900" font-size="9" fill="url(#unimeGold)" text-anchor="middle" letter-spacing="1.5">1548</text>
  </g>

  <!-- Tipografia UniMe -->
  <g transform="translate(130, 0)">
    <text x="0" y="52" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="3">UNIME</text>
    <text x="2" y="74" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="url(#unimeGold)" letter-spacing="3.5">UNIVERSITÀ DEGLI STUDI DI MESSINA</text>
    <text x="2" y="92" font-family="'Inter', sans-serif" font-weight="500" font-size="9.5" fill="rgba(255,255,255,0.7)" letter-spacing="1.5">MORGANA &amp; ORUM STUDENT QUIZ</text>
  </g>
</svg>
